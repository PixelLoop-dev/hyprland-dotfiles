# Общие настройки
general {
    disable_loading_bar = false
    grace = 5
    hide_cursor = true
    no_fade_in = false
}

# Настройка фона с размытием
background {
    monitor =

    path = $HOME/.config/hypr/wallpaper.png
    blur_passes = 3
    blur_size = 5
    brightness = 0.7172 
    contrast = 0.8916
    vibrancy = 0.1696
}

