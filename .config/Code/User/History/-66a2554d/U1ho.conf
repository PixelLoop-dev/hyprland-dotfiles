# Общие настройки
general {
    disable_loading_bar = false
    grace = 5
    hide_cursor = true
    no_fade_in = false
}

# Настройка фона с размытием
background {
    monitor =

    path = $HOME/.config/hypr/wallpaper.png
    blur_passes = 3
    blur_size = 5
    brightness = 0.7172 
    contrast = 0.8916
    vibrancy = 0.1696
}

label {
  text = cmd[date +'%H:%M']
  font = "JetBrainsMono Nerd Font Bold"
  color = rgba(202, 211, 245, 1)
  font_size = 120
  position = 0, -100
  halign = center
  valign = center
}

# Дата ниже
label {
  text = $DATE
  font = "JetBrainsMono Nerd Font"
  color = rgba(202, 211, 245, 1)
  font_size = 28
  position = 0, 20
  halign = center
  valign = center
}

# Поле ввода пароля
input-field {
  size = 250, 50
  position = 0, 150
  monitor = 
  dots_center = true
  outline_thickness = 3
  inner_color = rgba(20,20,20,0.6)
  font_color = rgba(202, 211, 245, 1)
  placeholder_text = "Введите пароль..."
  fail_color = rgba(200,50,50,1.0)
}
