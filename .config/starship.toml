format = "$directory$character"
add_newline = false

[os]
disabled = false
style = "bold #D9CECC" 

[os.symbols]
Arch = "Hiiiii"

[git_branch]
format = "[(‹$branch›)]($style) "
style = "#D9CECC"
only_attached = true

[directory]
style = "bold #D9CECC"
truncation_length = 2
truncate_to_repo = true
truncation_symbol = "../"


[character]
success_symbol = "[➜](bold #D9CECC)"
error_symbol   = "[➜](#f7768e)"
